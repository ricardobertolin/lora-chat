<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoRa Chat</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a2e;
    --panel-2: #1c2540;
    --line: #2a3557;
    --text: #e8ecf8;
    --muted: #8e9ac0;
    --accent: #4c8dff;
    --good: #3ecf8e;
    --fair: #f5b342;
    --weak: #ff5c5c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fc;
      --panel: #ffffff;
      --panel-2: #eef1f9;
      --line: #d9e0f0;
      --text: #131a2c;
      --muted: #5d6a8c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    /* Keeps the composer clear of the Android gesture bar. */
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .title { font-weight: 650; letter-spacing: .2px; }
  .title small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: var(--muted);
  }
  .spacer { flex: 1; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .pill.on .dot { background: var(--good); }
  .pill.on { color: var(--text); }

  button {
    font: inherit;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    min-height: 40px;
  }
  button.ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--text);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: min(78%, 560px);
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.sent {
    align-self: flex-end;
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.recv { align-self: flex-start; border-bottom-left-radius: 4px; }
  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .msg.sent .meta { color: rgba(255,255,255,.8); justify-content: flex-end; }
  .who { font-weight: 650; }

  .sig {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .sig::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .sig.good::before { background: var(--good); }
  .sig.fair::before { background: var(--fair); }
  .sig.weak::before { background: var(--weak); }

  .note {
    align-self: center;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    max-width: 90%;
    overflow-wrap: anywhere;
  }
  .note.err { color: var(--weak); }

  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    flex: 0 0 auto;
  }
  input[type=text] {
    flex: 1;
    font: inherit;
    font-size: 16px; /* keeps iOS/Android from zooming on focus */
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    min-width: 0;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  #banner {
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    display: none;
  }
  #banner.show { display: block; }

  #callBanner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    flex: 0 0 auto;
  }
  #callBanner.show { display: flex; }
  #callBanner button { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5); color: #fff; }
  #callBanner #answerBtn { background: #fff; color: var(--accent); }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--text); }

  #posPanel, #setPanel, #testPanel {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    flex: 0 0 auto;
  }
  #posPanel.show, #setPanel.show, #testPanel.show { display: flex; }
  .prow input[type=password] {
    flex: 1 1 140px;
    font: inherit;
    font-size: 16px;
    padding: 7px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    min-width: 0;
  }
  .lock { font-size: 11px; }
  .prow {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .prow input[type=text] {
    flex: 1 1 120px;
    font-size: 16px;
    padding: 7px 10px;
  }
  button.sm {
    font-size: 13px;
    padding: 6px 10px;
    min-height: 34px;
  }
  .muted { color: var(--muted); }
  .peers {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: var(--muted);
  }
  .peer {
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .peer b { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="title">
    LoRa Chat
    <small id="sub">not connected</small>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="status"><span class="dot"></span><span id="statusText">offline</span></span>
  <button id="posBtn" class="ghost" title="Position sharing">Pos</button>
  <button id="testBtn" class="ghost" title="Link test and statistics">Test</button>
  <button id="callBtn" class="ghost" title="Ring the other side until they answer">Call</button>
  <button id="setBtn" class="ghost" title="Encryption, history, diagnostics">Set</button>
  <button id="connect">Connect</button>
</header>

<div id="callBanner">
  <span id="callText">Incoming call</span>
  <button id="answerBtn" class="sm">Answer</button>
  <button id="dismissBtn" class="ghost sm">Dismiss</button>
</div>

<div id="testPanel">
  <div class="prow">
    <strong>Link test</strong>
    <span id="testState" class="muted">idle</span>
  </div>
  <div class="prow">
    <label class="muted" for="testInterval">every</label>
    <input type="text" id="testInterval" value="5" inputmode="decimal" style="flex:0 0 60px">
    <span class="muted">s</span>
    <button id="testStart" class="sm">Start</button>
    <button id="testStop" class="ghost sm">Stop</button>
    <button id="testCsv" class="ghost sm">Export CSV</button>
  </div>
  <div class="stats" id="testStats">no samples yet</div>
</div>

<div id="setPanel">
  <div class="prow">
    <strong>Encryption</strong>
    <span id="encState" class="muted">off</span>
  </div>
  <div class="prow">
    <input type="password" id="passIn" placeholder="shared passphrase" autocomplete="off">
    <button id="encOn" class="sm">Enable</button>
    <button id="encOff" class="ghost sm">Disable</button>
  </div>
  <div class="prow muted">Both ends need the same passphrase. Sender names and
    timing stay visible; only the message text is hidden.</div>
  <div class="prow">
    <strong>Sound</strong>
    <span id="soundState" class="muted"></span>
    <button id="soundToggle" class="ghost sm">Toggle</button>
  </div>
  <div class="prow">
    <strong>History</strong>
    <span id="histState" class="muted"></span>
    <button id="histClear" class="ghost sm">Clear</button>
  </div>
  <div class="prow">
    <button id="diag" class="ghost sm">USB diagnostics</button>
  </div>
</div>

<div id="banner"></div>

<div id="posPanel">
  <div class="prow">
    <strong>My position</strong>
    <span id="myPos" class="muted">off</span>
  </div>
  <div class="prow">
    <button id="useGps" class="ghost sm">Use GPS</button>
    <button id="manualBtn" class="ghost sm">Set manually</button>
    <button id="shareBtn" class="ghost sm">Share: off</button>
    <button id="posClear" class="ghost sm">Clear</button>
  </div>
  <div class="prow" id="manualRow" hidden>
    <input type="text" id="mLat" placeholder="latitude" inputmode="decimal" autocomplete="off">
    <input type="text" id="mLon" placeholder="longitude" inputmode="decimal" autocomplete="off">
    <button id="mSave" class="sm">Save</button>
  </div>
  <div class="peers" id="peers">no peers yet</div>
</div>

<div id="log" role="log" aria-live="polite"></div>

<form id="composer">
  <input type="text" id="input" placeholder="Connect a board to start" autocomplete="off"
         autocapitalize="sentences" enterkeyhint="send" disabled>
  <button type="submit" id="send" disabled>Send</button>
</form>

<script type="module" src="app.js"></script>
</body>
</html>
